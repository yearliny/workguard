name: Build and verify Windows MVP
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run deterministic behavior and persistence tests
        run: dotnet run --project tests/WorkGuard.Tests -c Release
  windows:
    needs: core
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile WPF and tests
        run: dotnet build WorkGuard.slnx -c Release
      - name: Load real Windows views and native integration
        shell: pwsh
        env:
          WORKGUARD_CAPTURE_DIR: artifacts/screenshots
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui
          path: artifacts/screenshots/*.png
          retention-days: 30
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/WorkGuard.Windows/WorkGuard.Windows.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid application version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Package portable and lightweight Windows apps
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime win-x64 -SkipTests
      - name: Verify both packaged applications
        shell: pwsh
        run: |
          ./scripts/smoke-windows.ps1 -Executable ./artifacts/publish/win-x64/portable/WorkGuard.exe
          ./scripts/smoke-windows.ps1 -Executable ./artifacts/publish/win-x64/lite/WorkGuard.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WorkGuard-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/WorkGuard-${{ steps.version.outputs.version }}-win-x64-*.zip
            artifacts/SHA256SUMS-win-x64.txt
          if-no-files-found: error
          retention-days: 30
  release:
    needs: windows
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WorkGuard-${{ needs.windows.outputs.version }}-win-x64
          path: artifacts
      - name: Publish a new version after all checks pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: ./scripts/release.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -Version $env:RELEASE_VERSION
