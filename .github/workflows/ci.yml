name: Build and verify WorkGuard
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run deterministic behavior and persistence tests
        run: dotnet run --project tests/WorkGuard.Tests -c Release
  windows:
    needs: core
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile WPF and tests
        run: dotnet build WorkGuard.slnx -c Release
      - name: Load real Windows views and native integration
        shell: pwsh
        env:
          WORKGUARD_CAPTURE_DIR: artifacts/screenshots
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: windows-ui
          path: artifacts/screenshots/*.png
          retention-days: 7
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/WorkGuard.Windows/WorkGuard.Windows.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid application version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build framework-dependent portable package
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime win-x64 -SkipTests
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install Inno Setup.' }
          }
      - name: Build self-contained and framework-dependent installers
        shell: pwsh
        run: ./scripts/installer.ps1 -Runtime win-x64 -Mode both -SkipTests
      - name: Verify packaged application
        shell: pwsh
        run: |
          ./scripts/smoke-windows.ps1 -Executable ./artifacts/publish/win-x64/portable-lite/WorkGuard.exe
          $version = '${{ steps.version.outputs.version }}'
          $expected = @(
            "artifacts/WorkGuard-$version-win-x64-portable-lite.zip",
            "artifacts/WorkGuard-$version-win-x64-setup-selfcontained.exe",
            "artifacts/WorkGuard-$version-win-x64-setup-lite.exe",
            "artifacts/SHA256SUMS-win-x64.txt"
          )
          foreach ($path in $expected) { if (-not (Test-Path $path -PathType Leaf)) { throw "Missing package: $path" } }
          $lines = @(Get-Content artifacts/SHA256SUMS-win-x64.txt | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($lines.Count -ne 3) { throw 'Expected exactly three package checksums.' }
          foreach ($package in $expected[0..2]) {
            $name = Split-Path $package -Leaf
            $line = @($lines | Where-Object { $_ -match ('^[a-f0-9]{64}  ' + [regex]::Escape($name) + '$') })
            if ($line.Count -ne 1) { throw "Missing checksum: $name" }
            if ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne $line[0].Substring(0, 64)) { throw "Checksum mismatch: $name" }
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: WorkGuard-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/WorkGuard-${{ steps.version.outputs.version }}-win-x64-portable-lite.zip
            artifacts/WorkGuard-${{ steps.version.outputs.version }}-win-x64-setup-selfcontained.exe
            artifacts/WorkGuard-${{ steps.version.outputs.version }}-win-x64-setup-lite.exe
            artifacts/SHA256SUMS-win-x64.txt
          if-no-files-found: error
          retention-days: 7
  release:
    needs: windows
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WorkGuard-${{ needs.windows.outputs.version }}-win-x64
          path: artifacts
      - name: Publish a new version after all checks pass
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: ./scripts/release.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -Version $env:RELEASE_VERSION
  distribution:
    needs: [windows, release]
    if: github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WorkGuard-${{ needs.windows.outputs.version }}-win-x64
          path: artifacts
      - name: Build public update feed
        shell: pwsh
        run: ./scripts/build-update-site.ps1 -Version '${{ needs.windows.outputs.version }}'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload update distribution
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/update-site
      - name: Deploy public update distribution
        id: deployment
        uses: actions/deploy-pages@v4
