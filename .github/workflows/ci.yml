name: Build and verify Windows MVP
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run deterministic behavior and persistence tests
        run: dotnet run --project tests/WorkGuard.Tests -c Release
  windows:
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile WPF and tests
        run: dotnet build WorkGuard.slnx -c Release
      - name: Load real Windows views and native integration
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Package portable Windows x64 app with runtime
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime win-x64 -SkipTests
      - name: Verify packaged application
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Executable ./artifacts/publish/win-x64/WorkGuard.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WorkGuard-0.1.0-win-x64
          path: artifacts/WorkGuard-0.1.0-win-x64.zip
          if-no-files-found: error
          retention-days: 30
